<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate My Campus - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS Files -->
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="login.css">
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="api.js"></script>
</head>

<body>
    <!-- NAVBAR COMPONENT -->
    <div id="navbar-container"></div>

    <!-- MAIN CONTENT -->
    <main>
        <!-- LOGIN SECTION -->
        <section id="login" class="login-section">
            <div class="form-container">
                <div id="loginError" class="alert" style="display:none;"></div>
                <h2>Login</h2>

                <!-- Login Tabs -->
                <div class="login-tabs">
                    <div class="tab active" data-tab="student">Student</div>
                    <div class="tab" data-tab="hod">HOD</div>
                    <div class="tab" data-tab="admin">College Admin</div>
                </div>

                <!-- Student Login Form -->
                <form id="studentForm" class="login-form active">
                    <div class="form-group">
                        <label for="enrollment">Enrollment Number</label>
                        <input type="text" id="enrollment" name="enrollment" placeholder="Enter your enrollment number"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <input type="number" id="semester" name="semester" placeholder="Enter your semester" min="1"
                            max="8" required>
                    </div>
                    <div class="form-group">
                        <label for="college">College</label>
                        <select id="college" name="collegeId" required>
                            <option value="">Select your college</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary w-full">Login as Student</button>
                </form>

                <!-- HOD Login Form -->
                <form id="hodForm" class="login-form">
                    <div class="form-group">
                        <label for="hodEmail">Email</label>
                        <input type="email" id="hodEmail" name="email" placeholder="Enter your email address" required>
                    </div>
                    <div class="form-group">
                        <label for="hodPassword">Password</label>
                        <input type="password" id="hodPassword" name="password" placeholder="Enter your password"
                            required>
                    </div>
                    <button type="submit" class="btn btn-secondary w-full">Login as HOD</button>
                </form>

                <!-- College Admin Login Form -->
                <form id="adminForm" class="login-form">
                    <div class="form-group">
                        <label for="adminEmail">Email</label>
                        <input type="email" id="adminEmail" name="email" placeholder="Enter your email address"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Password</label>
                        <input type="password" id="adminPassword" name="password" placeholder="Enter your password"
                            required>
                    </div>
                    <button type="submit" class="btn btn-secondary w-full">Login as Admin</button>
                </form>
            </div>

        </section>
    </main>

    <!-- FOOTER COMPONENT -->
    <div id="footer-container"></div>

    <!-- JAVASCRIPT -->
    <script>
        $(document).ready(function () {
            // Load navbar component
            $('#navbar-container').load('navbar.html');

            // Load footer component
            $('#footer-container').load('footer.html');

            // Populate College select from API
            function populateCollegeSelect(items) {
                var $sel = $('#college');
                $sel.empty();
                $sel.append('<option value="">Select your college</option>');
                if (!items || !items.length) return;
                $.each(items, function (_, c) {
                    var id = c.id || c.cid || c.c_id || '';
                    var name = c.name || c.cname || c.collegeName || 'Unnamed College';
                    $sel.append('<option value="' + id + '">' + name + '</option>');
                });
            }

            API.getColleges()
                .done(function (res) {
                    var items = Array.isArray(res) ? res : (res && res.data) ? res.data : [];
                    populateCollegeSelect(items);
                })
                .fail(function () {
                    populateCollegeSelect([]);
                });

            // Tab switching functionality
            $('.tab').on('click', function () {
                var tabId = $(this).data('tab');

                // Remove active class from all tabs and forms
                $('.tab').removeClass('active');
                $('.login-form').removeClass('active');

                // Add active class to clicked tab and corresponding form
                $(this).addClass('active');
                $('#' + tabId + 'Form').addClass('active');
            });

            // small helper to decode JWT payload (base64url)
            function decodeJwtPayload(token) {
                try {
                    const parts = token.split('.');
                    if (parts.length < 2) return null;
                    let payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                    while (payload.length % 4) payload += '=';
                    const decoded = atob(payload);
                    const json = decodeURIComponent(decoded.split('').map(function (c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(json);
                } catch (e) {
                    return null;
                }
            }

            // Enhanced login functionality for all forms
            $('.login-form').on('submit', function (e) {
                e.preventDefault();

                var $btn = $(this).find('button[type="submit"]');
                var $form = $(this);
                var formId = $(this).attr('id');
                var userType = formId.replace('Form', '');

                // Add loading state
                $btn.addClass('loading').prop('disabled', true);

                // Build payload per role
                var payload = {};
                if (userType === 'student') {
                    payload = {
                        enrollment: $('#enrollment').val(),
                        semester: Number($('#semester').val()),
                        collegeId: $('#college').val()
                    };
                    // Basic required validation for student fields
                    if (!payload.enrollment || !payload.semester || !payload.collegeId) {
                        $('#loginError').text('Please enter enrollment, semester and select your college.').show();
                        $btn.removeClass('loading').prop('disabled', false);
                        return;
                    }
                } else if (userType === 'admin') {
                    payload = { email: $('#adminEmail').val(), password: $('#adminPassword').val() };
                } else if (userType === 'hod') {
                    payload = { email: $('#hodEmail').val(), password: $('#hodPassword').val() };
                }

                // Call backend per role
                var loginCall = userType === 'student' ? API.loginStudent(payload)
                    : userType === 'admin' ? API.loginAdmin(payload)
                        : API.loginHod(payload);

                loginCall
                    .done(function (res) {
                        try {
                            // Clear any previous errors
                            $('#loginError').hide();

                            // Normalize token value (either raw string or res.token)
                            const token = (typeof res === 'string' && res.includes('.')) ? res : (res && res.token ? res.token : null);

                            // Check if token is null or undefined
                            if (!token) {
                                console.error('No token received from server');
                                var errorMsg = 'Authentication failed: No token received';

                                // Check for server error message
                                if (res && res.message) {
                                    errorMsg = res.message;
                                } else if (res && res.error) {
                                    errorMsg = res.error;
                                }

                                $('#loginError').text(errorMsg).show();
                                $btn.removeClass('loading').prop('disabled', false);
                                return; // Stop execution - don't redirect
                            }

                            // Decode JWT payload
                            const jwtPayload = decodeJwtPayload(token);
                            if (!jwtPayload) {
                                console.error('Failed to decode JWT token');
                                $('#loginError').text('Authentication failed: Invalid token format').show();
                                $btn.removeClass('loading').prop('disabled', false);
                                return; // Stop execution - don't redirect
                            }

                            console.log('JWT Payload:', jwtPayload);

                            // Store token and JWT payload based on user type
                            if (userType === 'student') {
                                localStorage.setItem('rmc_token', token);
                                localStorage.setItem('rmc_user', JSON.stringify(jwtPayload));
                                console.log('Student data stored from JWT:', jwtPayload);
                            } else if (userType === 'hod') {
                                localStorage.setItem('rmc_hod_token', token);
                                localStorage.setItem('rmc_hod_user', JSON.stringify(jwtPayload));
                                console.log('HOD data stored from JWT:', jwtPayload);
                            } else if (userType === 'admin') {
                                localStorage.setItem('rmc_college_admin_token', token);
                                localStorage.setItem('rmc_college_admin_user', JSON.stringify(jwtPayload));
                                console.log('College Admin data stored from JWT:', jwtPayload);
                            }

                            // Redirect based on role after successful storage
                            if (userType === 'student') {
                                window.location.href = 'profile.html';
                            } else if (userType === 'hod') {
                                window.location.href = 'admin-dashboard.html';
                            } else if (userType === 'admin') {
                                window.location.href = 'college-admin-dashboard.html';
                            } else {
                                // default
                                window.location.href = 'profile.html';
                            }
                        } catch (e) {
                            console.error('Error processing login response:', e);
                            $('#loginError').text('Error processing login response: ' + e.message).show();
                            $btn.removeClass('loading').prop('disabled', false);
                            return;
                        }
                    })
                    .fail(function (xhr) {
                        var msg = 'Login failed';
                        if (xhr && xhr.responseJSON && xhr.responseJSON.message) msg = xhr.responseJSON.message;
                        console.error('Login API error:', xhr.responseJSON || xhr);
                        $('#loginError').text(msg).show();
                    })
                    .always(function () {
                        $btn.removeClass('loading').prop('disabled', false);
                    });
            });

            // Form input focus effects
            $('.form-group input, .form-group select').on('focus', function () {
                $(this).parent().addClass('focused');
            }).on('blur', function () {
                $(this).parent().removeClass('focused');
            });
        });
    </script>
</body>

</html>
